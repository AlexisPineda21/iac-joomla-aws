# Destruccion manual de toda la infraestructura de infra/ (no toca bootstrap: el bucket
# del estado, ECR y los roles se conservan para volver a desplegar).
# Actions -> infra-destroy -> Run workflow -> escribir "destroy" -> aprobar en production.
name: infra-destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "destroy" para confirmar'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  destroy:
    name: terraform destroy (requiere aprobacion)
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TF_VERSION }}
          terraform_wrapper: false

      - name: Credenciales temporales de AWS (OIDC, environment production)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_APPLY_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"

      - name: terraform destroy
        run: |
          terraform plan -destroy -lock-timeout=5m -var-file=env/prod.tfvars -out=destroy.tfplan -no-color
          terraform apply -lock-timeout=5m -no-color destroy.tfplan
          echo "Infraestructura destruida. bootstrap (estado, ECR, roles y repositorios) se conserva." >> "$GITHUB_STEP_SUMMARY"
