# CI de la infraestructura (opcion B), en cada pull request a main que toque infra/ o bootstrap/:
#   fmt -> init -> validate -> tflint -> terraform test (proveedores simulados) -> plan
# El plan se publica como comentario en el PR. El rol de AWS es de solo lectura.
name: infra-plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - "bootstrap/**"
      - ".github/workflows/infra-*.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: infra-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  plan:
    name: fmt, validate, tflint, test y plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        id: fmt
        working-directory: .
        run: terraform fmt -check -recursive -diff

      - name: Credenciales temporales de AWS (OIDC, solo lectura)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PLAN_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        id: init
        run: terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"

      - name: terraform validate
        id: validate
        run: terraform validate -no-color

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.66.0

      - name: tflint
        id: tflint
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/infra/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/infra/.tflint.hcl" --format compact

      - name: terraform test
        id: test
        run: terraform test -no-color

      - name: terraform plan
        id: plan
        run: |
          terraform plan -lock=false -var-file=env/prod.tfvars -out=tfplan -no-color
          terraform show -no-color tfplan > plan.txt

      - name: Publicar el plan en el pull request
        if: always()
        uses: actions/github-script@v9
        env:
          OUTCOMES: >-
            fmt=${{ steps.fmt.outcome }},init=${{ steps.init.outcome }},validate=${{ steps.validate.outcome }},tflint=${{ steps.tflint.outcome }},test=${{ steps.test.outcome }},plan=${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- infra-plan -->';
            const icon = { success: '✅', failure: '❌', skipped: '⏭️', cancelled: '⏹️' };
            const rows = process.env.OUTCOMES.split(',').map(pair => {
              const [step, outcome] = pair.split('=');
              return `| ${step} | ${icon[outcome] || ''} ${outcome} |`;
            });
            let plan = 'No se generó el plan (revisa el log del workflow).';
            let summary = '';
            if (fs.existsSync('infra/plan.txt')) {
              plan = fs.readFileSync('infra/plan.txt', 'utf8');
              const match = plan.match(/(Plan: .*|No changes\..*)/);
              summary = match ? `**${match[0]}**` : '';
              if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (plan recortado)';
            }
            const body = [
              marker,
              `### Terraform \`infra/\` — commit ${context.sha.substring(0, 7)}`,
              '',
              '| Paso | Resultado |',
              '|---|---|',
              ...rows,
              '',
              summary,
              '',
              '<details><summary>Ver el plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '</details>',
              '',
              `_Workflow: [${context.workflow} #${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const previous = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }
