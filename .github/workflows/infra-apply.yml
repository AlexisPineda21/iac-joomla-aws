# CD de la infraestructura (opcion B), en cada push a main que toque infra/:
#   job plan  (rol de solo lectura): init, validate y plan guardado como artefacto
#   job apply (environment "production"): espera la APROBACION en GitHub y aplica
#             exactamente el plan revisado; despues verifica que el sitio responda.
name: infra-apply

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-apply.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  plan:
    name: terraform plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TF_VERSION }}
          terraform_wrapper: false

      - name: Credenciales temporales de AWS (OIDC, solo lectura)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PLAN_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init y validate
        run: |
          terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"
          terraform validate -no-color

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -lock=false -var-file=env/prod.tfvars -out=tfplan -no-color -detailed-exitcode
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "$code" -eq 2 ]; then echo "changes=true" >> "$GITHUB_OUTPUT"; else echo "changes=false" >> "$GITHUB_OUTPUT"; fi
          terraform show -no-color tfplan > plan.txt
          {
            echo "## Plan de infraestructura"
            echo
            grep -E "^(Plan:|No changes)" plan.txt || true
            echo
            echo '<details><summary>Ver el plan completo</summary>'
            echo
            echo '```terraform'
            head -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el plan
        if: steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: |
            infra/tfplan
            infra/plan.txt
            infra/.terraform.lock.hcl
          include-hidden-files: true
          retention-days: 7

  apply:
    name: terraform apply (requiere aprobacion)
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ steps.output.outputs.joomla_url }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - name: Recuperar el plan aprobado
        uses: actions/download-artifact@v7
        with:
          name: tfplan
          path: infra

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TF_VERSION }}
          terraform_wrapper: false

      - name: Credenciales temporales de AWS (OIDC, environment production)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_APPLY_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"

      - name: terraform apply
        run: terraform apply -lock-timeout=5m -no-color tfplan

      - name: Salidas
        id: output
        run: |
          terraform output -no-color
          echo "joomla_url=$(terraform output -raw joomla_url)" >> "$GITHUB_OUTPUT"

      - name: Verificar que el sitio responda
        env:
          URL: ${{ steps.output.outputs.joomla_url }}
        run: |
          # La primera vez el contenedor instala Joomla: puede tardar varios minutos
          for attempt in $(seq 1 60); do
            if body=$(curl -fsS --max-time 10 "$URL/health.php"); then
              echo "Sitio disponible (intento $attempt): $body"
              echo "Sitio disponible en $URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Intento $attempt: el sitio aun no responde"
            sleep 15
          done
          echo "::warning::El sitio no respondio en 15 minutos. Revisar el servicio en ECS y que exista la imagen en ECR (pipeline de joomla-app)."
